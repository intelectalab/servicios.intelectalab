version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_saas
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_local_password
    ports:
      - "5432:5432"
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: erp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - erp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  minio:
    image: quay.io/minio/minio:latest
    container_name: erp_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: erp_minio_admin
      MINIO_ROOT_PASSWORD: erp_minio_password
    command: server /data --console-address ":9001"
    volumes:
      - erp_minio_data:/data

volumes:
  erp_postgres_data:
  erp_redis_data:
  erp_minio_data: